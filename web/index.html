<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dranglpak64 · Hall of Shame</title>
<style>
  /* Served by the Pi itself: visitors on the hotspot have no internet. */
  @font-face {
    font-family: "Russo One";
    src: url("/RussoOne-Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --bg: #07080b;
    --panel: #11141a;
    --line: #262b36;
    --text: #eef1f6;
    --muted: #8a93a6;
    --accent: #ffb000;
    --hot: #ff5a1f;
    /* Same as the logo (swag/make_swag.py) */
    --chrome: linear-gradient(180deg, #ffffff 0%, #dfe4ee 25%, #8a93a6 50%, #f4f6fb 55%, #6b7280 100%);
    --fire: linear-gradient(180deg, #ffb000 0%, #d91e1e 100%);
    --display: "Russo One", system-ui, sans-serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1a1f2b 0%, var(--bg) 65%);
    color: var(--text);
    font-family: var(--sans);
    font-size: clamp(14px, 1.15vw, 28px);
    overflow: hidden;
  }
  .chrome, .fire { -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chrome { background-image: var(--chrome); }
  .fire { background-image: var(--fire); }
  .wrap {
    height: 100%;
    display: grid;
    grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    gap: 1.2em;
    padding: 1.4em 2em;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
  h1 { display: flex; align-items: flex-end; gap: 1em; }
  h1 img { height: 3.4em; display: block; }
  h1 small { font-family: var(--display); font-weight: 400; font-size: .75em; color: var(--muted); letter-spacing: .2em; padding-bottom: .5em; }
  .conn { font-size: .8em; color: var(--muted); }
  .conn.off { color: var(--hot); }

  .totals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.2em; }
  .stat, section {
    background: linear-gradient(180deg, #161a22 0%, var(--panel) 100%);
    border: 1px solid var(--line); border-radius: .6em;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 .4em 1.2em rgba(0, 0, 0, .4);
  }
  .stat { padding: .8em 1.2em; }
  .stat .label { color: var(--muted); text-transform: uppercase; letter-spacing: .15em; font-size: .8em; }
  .stat .value { font-family: var(--display); font-size: 3em; line-height: 1.1; margin-top: .15em; display: inline-block; }
  .stat .value.bump { animation: bump .5s ease-out; }
  @keyframes bump { 30% { transform: scale(1.12); filter: drop-shadow(0 0 .3em var(--hot)); } }

  main { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 1.2em; min-height: 0; }
  section { padding: 1em 1.2em; min-height: 0; overflow: hidden; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 1em; color: var(--muted); margin-bottom: 1em; letter-spacing: .12em; }

  .players { display: grid; gap: .7em; }
  .player { display: grid; grid-template-columns: 3.2em 1fr auto 2em; align-items: center; gap: .8em; }
  .player .place { font-size: 1.5em; text-align: center; }
  .badge { font-family: var(--display); font-size: 1em; text-align: center; padding: .4em 0; border-radius: .4em; color: #0b0c10;
           box-shadow: inset 0 -.2em 0 rgba(0, 0, 0, .25), inset 0 .15em 0 rgba(255, 255, 255, .35); }
  .bar { height: 1.6em; background: #1b1f28; border-radius: .4em; overflow: hidden; box-shadow: inset 0 .1em .3em rgba(0, 0, 0, .5); }
  .bar > div { height: 100%; border-radius: .4em; transition: width .4s ease-out;
               background-image: linear-gradient(180deg, rgba(255, 255, 255, .35) 0%, rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .2) 100%); }
  .player .nums { font-weight: 800; white-space: nowrap; min-width: 4.5em; text-align: right; }
  .empty { color: var(--muted); font-style: italic; }

  .causes { display: grid; gap: .55em; }
  .cause { display: grid; grid-template-columns: 1.8em 1fr auto; align-items: center; gap: .6em; }
  .cause .emoji { font-size: 1.3em; }
  .cause .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cause .n { font-family: var(--display); font-size: 1.1em; color: var(--accent); }
  .cause .track { grid-column: 2 / 4; height: .35em; background: #1b1f28; border-radius: .2em; margin-top: -.3em; }
  .cause .track > div { height: 100%; background-image: linear-gradient(90deg, #d91e1e, #ffb000); border-radius: .2em; transition: width .4s; }

  .ticker { list-style: none; padding: 0; display: grid; gap: .5em; }
  .ticker li { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: .6em; align-items: center; }
  .ticker .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticker li:first-child { animation: slidein .4s ease-out; }
  .ticker .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85em; }
  .ticker .who { font-family: var(--display); font-size: .8em; padding: .2em .45em; border-radius: .3em; color: #0b0c10; }
  .ticker .ml { color: var(--accent); font-weight: 800; }
  @keyframes slidein { from { transform: translateX(-1em); opacity: 0; } }

  footer { display: flex; justify-content: space-between; color: var(--muted); font-size: .9em; gap: 2em; }

  .audience { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: .6em 1.2em; padding: .7em 1.2em; }
  .audience-title { font-family: var(--display); font-size: 1.15em; }
  .steal-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5em; justify-self: end; width: min(100%, 30em); }
  .audience button {
    font: inherit; font-family: var(--display); font-size: 1.1em; padding: .55em .6em .4em; border-radius: .5em; cursor: pointer;
    border: 0; color: #0b0c10; background: var(--pc, var(--accent));
    box-shadow: inset 0 -.2em 0 rgba(0, 0, 0, .25), inset 0 .15em 0 rgba(255, 255, 255, .35);
  }
  .audience button small { display: block; font-family: var(--sans); font-size: .62em; font-weight: 700; margin-top: .15em; }
  .say { grid-column: 1 / -1; display: flex; gap: .5em; }
  .say-to { display: flex; gap: .3em; }
  .say-to button { font-size: .85em; padding: .45em .6em .35em; opacity: .4; }
  .say-to button.on { opacity: 1; outline: 2px solid var(--text); outline-offset: 1px; }
  .say input {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: #0b0d12; border: 1px solid var(--line);
    border-radius: .5em; padding: .5em .8em;
  }
  .say input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .audience-feedback { grid-column: 1 / -1; font-size: .9em; color: var(--accent); }
  .audience-feedback:empty { display: none; }
  footer b { color: var(--accent); }

  #flash {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(26, 31, 43, .9) 0%, rgba(7, 8, 11, .94) 70%);
    opacity: 0; transition: opacity .25s;
  }
  #flash.show { opacity: 1; }
  #flash .card { text-align: center; transform: scale(.6); transition: transform .35s cubic-bezier(.2, 1.6, .4, 1); }
  #flash.show .card { transform: scale(1); }
  #flash .big { font-size: 9em; line-height: 1; }
  #flash .who { font-family: var(--display); font-size: 3.2em; margin-top: .3em; }
  #flash .what { font-family: var(--display); font-weight: 400; font-size: 2.4em; margin-top: .3em; }
  #flash .ml { font-family: var(--display); font-size: 2.6em; margin-top: .4em; display: inline-block; }

  @media (max-width: 800px) {
    .audience { display: block; padding: .9em 1em; }
    .audience-title { margin-bottom: .7em; }
    .steal-buttons { width: 100%; }
    .say { flex-wrap: wrap; }
    .say-to { width: 100%; }
    .say-to button { flex: 1; }
    .say { margin-top: .7em; }
    .audience-feedback { margin-top: .6em; }
    html, body { height: auto; }
    body { overflow: auto; font-size: 15px; }
    .wrap { height: auto; padding: 16px; gap: 14px; grid-template-rows: none; }
    h1 { flex-direction: column; align-items: flex-start; gap: .3em; }
    h1 img { height: auto; width: min(70vw, 320px); }
    h1 { font-size: 1em; }
    h1 small { font-size: .8em; letter-spacing: .12em; padding: 0; }
    .conn { font-size: .75em; align-self: flex-start; }
    .totals { gap: 8px; }
    .stat { padding: .6em .7em; }
    .stat .label { font-size: .62em; letter-spacing: .08em; }
    .stat .value { font-size: 1.4em; white-space: nowrap; }
    .ticker li { grid-template-columns: auto minmax(0, 1fr) auto; }
    .ticker .t { display: none; }
    main { grid-template-columns: 1fr; gap: 14px; }
    footer { flex-direction: column; gap: .5em; }
    #flash .big { font-size: 6em; }
    #flash .who { font-size: 2em; }
    #flash .what { font-size: 1.5em; padding: 0 16px; }
    #flash .ml { font-size: 1.6em; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img src="/logo.svg" alt="DranglPak64"><small>ROBOEXOTICA 2026</small></h1>
    <div class="conn" id="conn">verbinde…</div>
  </header>

  <section class="audience">
    <div class="audience-title">📣 Publikum</div>
    <div class="steal-buttons" id="steal-buttons"></div>
    <form class="say" id="say">
      <div class="say-to" id="say-to" role="radiogroup" aria-label="An wen"></div>
      <input id="say-text" maxlength="64" autocomplete="off" placeholder="Schreib den Spielern etwas…">
      <button type="submit">💬 Schicken</button>
    </form>
    <div class="audience-feedback" id="audience-feedback"></div>
  </section>

  <div class="totals">
    <div class="stat"><div class="label">Heute gedrangelt</div><div class="value fire" id="ml">0,0 cl</div></div>
    <div class="stat"><div class="label">Shots gedrangelt</div><div class="value chrome" id="hits">0</div></div>
  </div>

  <main>
    <section>
      <h2>AKTUELLE RUNDE</h2>
      <div class="players" id="players"></div>
    </section>
    <section>
      <h2>WAS PASSIERT IST</h2>
      <div class="causes" id="causes"></div>
    </section>
    <section>
      <h2>LIVE-TICKER</h2>
      <ul class="ticker" id="ticker"></ul>
    </section>
  </main>

  <footer>
    <div id="record">Noch kein Pechvogel – wer traut sich?</div>
    <div>Wer etwas abkriegt, trinkt. 🍹 Bitte mit Maß und Ziel.</div>
  </footer>
</div>

<div id="flash"><div class="card">
  <div class="big" id="f-emoji"></div>
  <div class="who" id="f-who"></div>
  <div class="what" id="f-what"></div>
  <div class="ml fire" id="f-ml"></div>
</div></div>

<script>
const EVENTS = {
  driving_spinout:     ["🌀", "Ins Schleudern gekommen"],
  early_start_spinout: ["🚦", "Fehlstart"],
  // Other causes of VERTICAL_TUMBLE_TRIGGER than the hit_* below
  explosion_crash:     ["💥", "Zusammengekracht"],
  hit_bomb:            ["💣", "In die Luft geflogen"],
  hit_bus:             ["🚌", "In den Schulbus gekracht"],
  hit_car:             ["🚗", "In ein Auto gekracht"],
  hit_chain_chomp:     ["⛓️", "Vom Kettenhund erwischt"],
  hit_fake_item_box:   ["❓", "Falsche Itembox erwischt"],
  hit_snowman:         ["⛄", "In einen Schneemann gekracht"],
  hit_train:           ["🚂", "Vom Zug erwischt"],
  hit_truck:           ["🚚", "In einen Lkw gekracht"],
  fell_in_lava:        ["🌋", "In die Lava gefallen"],
  fell_in_water:       ["🌊", "Baden gegangen"],
  // Other causes of HIGH_TUMBLE_TRIGGER than those below
  high_tumble:         ["🤸", "Durch die Luft gewirbelt"],
  hit_blue_shell:      ["🔵", "Blauer Panzer"],
  hit_mole:            ["🕳️", "Vom Maulwurf erwischt"],
  hit_red_shell:       ["🔴", "Roter Panzer"],
  hit_banana:          ["🍌", "Auf der Banane ausgerutscht"],
  hit_by_star:         ["⭐", "Vom Stern überfahren"],
  hit_paddle_boat:     ["🚢", "Vom Raddampfer erwischt"],
  lightning_strike:    ["⚡", "Vom Blitz getroffen"],
  // Only green shells set LOW_TUMBLE_TRIGGER
  low_tumble:          ["🟢", "Grüner Panzer"],
  spinout:             ["💫", "Gedreht"],
  squished:            ["🥞", "Plattgewalzt"],
  terrain_tumble:      ["🪨", "Über Stock und Stein"],
};
// Only for priming the tubes; old stats may still contain them
const HIDDEN_EVENTS = ["negroni_code"];
const placeLabel = n => ["🥇", "🥈", "🥉"][n - 1] || `${n}.`;
const COLORS = ["#ff5d5d", "#4fc3ff", "#7dff6a", "#ffd23f", "#c38bff", "#ff9a3c", "#3cffd8", "#ff7ad9"];

const $ = id => document.getElementById(id);
const describe = e => EVENTS[e] || ["❓", e];
// Battle balloon colours by character, from render_battle_balloon() in nk64,
// brightened for the screen
const CHARACTER_COLORS = ["#ff2a1a", "#2bdc3c", "#22ffab", "#00cbff", "#ffc200", "#f7ff00", "#ff5e4d", "#a46bff"];
// The current race, see race_start
let game = null;
// character: as stored with an entry, else the current race's
const color = (p, character) => {
  const c = character ?? (game ? game.characters[p] : null);
  return c != null && c >= 0 ? CHARACTER_COLORS[c] : COLORS[p % COLORS.length];
};
const fmtCl = ml => `${(ml / 10).toLocaleString("de-AT", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} cl`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function setValue(el, text) {
  if (el.textContent === text) return;
  el.textContent = text;
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}

let stealButtonsFor = null;
// Recipient of messages: "all" or a player index
let sayTo = "all";
function renderStealButtons() {
  const players = game ? game.players : 4;
  const key = JSON.stringify(game);
  if (key === stealButtonsFor) return;
  stealButtonsFor = key;
  $("steal-buttons").style.gridTemplateColumns = `repeat(${players}, 1fr)`;
  $("steal-buttons").innerHTML = [...Array(players).keys()].map(p =>
    `<button data-p="${p}" style="--pc:${color(p)}">P${p + 1}<small>Item stehlen</small></button>`).join("");
  if (sayTo !== "all" && Number(sayTo) >= players) sayTo = "all";
  $("say-to").innerHTML = [["all", "Alle", "#9aa3b5"], ...[...Array(players).keys()].map(p => [String(p), `P${p + 1}`, color(p)])]
    .map(([to, label, c]) => `<button type="button" role="radio" data-to="${to}" style="--pc:${c}"` +
      ` class="${to === sayTo ? "on" : ""}" aria-checked="${to === sayTo}">${label}</button>`).join("");
}

function render(s) {
  game = s.game;
  renderStealButtons();
  setValue($("ml"), fmtCl(s.totalMl));
  setValue($("hits"), String(s.totalHits));

  const round = Object.entries(s.round).map(([p, d]) => [Number(p), d]).sort((a, b) => a[0] - b[0]);
  const maxMl = Math.max(1, ...round.map(([, d]) => d.ml));
  $("players").innerHTML = round.length ? round.map(([p, d]) => `
    <div class="player">
      <div class="badge" style="background:${color(p)}">P${p + 1}</div>
      <div class="bar"><div style="width:${100 * d.ml / maxMl}%;background:${color(p)}"></div></div>
      <div class="nums">${fmtCl(d.ml)}</div>
      <div class="place">${d.place ? placeLabel(d.place) : ""}</div>
    </div>`).join("")
    : `<div class="empty">Gleich geht's weiter… 🏁</div>`;

  const causes = Object.entries(s.byEvent).filter(([e]) => !HIDDEN_EVENTS.includes(e)).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxCause = Math.max(1, ...causes.map(([, n]) => n));
  $("causes").innerHTML = causes.length ? causes.map(([e, n]) => {
    const [emoji, name] = describe(e);
    return `<div class="cause"><div class="emoji">${emoji}</div><div class="name">${esc(name)}</div><div class="n">${n}</div>
      <div></div><div class="track"><div style="width:${100 * n / maxCause}%"></div></div></div>`;
  }).join("") : `<div class="empty">Bis jetzt hat's noch keinen erwischt.</div>`;

  $("ticker").innerHTML = s.ticker.filter(t => !HIDDEN_EVENTS.includes(t.event)).map(t => {
    const who = t.player >= 0
      ? `<span class="who" style="background:${color(t.player, t.character)}">P${t.player + 1}</span>`
      : `<span class="who" style="background:#9aa3b5">Alle</span>`;
    const [what, right] = {
      audience_say: [`💬 ${esc(t.text)}`, "📣"],
      audience_steal: [t.effect === "item" ? "🫳 Item gestohlen" : "🍀 Nichts zu holen", "📣"],
    }[t.event] || [describe(t.event).map(esc).join(" "), `+${fmtCl(t.ml)}`];
    return `<li><span class="t">${esc(t.t)}</span>${who}<span class="what">${what}</span><span class="ml">${right}</span></li>`;
  }).join("");

  const yesterday = s.recordYesterday
    ? ` · Gestern: <b>P${s.recordYesterday.player + 1}</b> mit <b>${s.recordYesterday.hits}</b>`
    : "";
  $("record").innerHTML = (s.record
    ? `🏆 Pechvogel vom Tag: <b>P${s.record.player + 1}</b> mit <b>${s.record.hits} Shots</b> in einer Runde (${esc(s.record.at)})`
    : "Noch kein Pechvogel – wer traut sich?") + yesterday;
}

renderStealButtons();

async function post(url, body, done, failed) {
  try {
    const r = await fetch(url, { method: "POST", body });
    $("audience-feedback").textContent = r.ok ? done : failed;
  } catch (e) {
    $("audience-feedback").textContent = "Hat nicht funktioniert, bitte noch einmal probieren.";
  }
}

$("steal-buttons").addEventListener("click", ev => {
  const btn = ev.target.closest("button");
  if (btn) post(`/steal?player=${btn.dataset.p}`, null, "🫳 Servus, Item!", "Hat nicht funktioniert.");
});

$("say-to").addEventListener("click", ev => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  sayTo = btn.dataset.to;
  stealButtonsFor = null;
  renderStealButtons();
});

$("say").addEventListener("submit", ev => {
  ev.preventDefault();
  const text = $("say-text").value.trim();
  if (!text) return;
  $("say-text").value = "";
  post(`/say?to=${sayTo}`, text, "💬 Ist unterwegs!", "Bitte nur Buchstaben, Zahlen und Satzzeichen.");
});

let lastFlash = null, flashTimer = null;
function flash(t) {
  if (!t || t.id === lastFlash) return;
  lastFlash = t.id;
  const finish = t.place !== undefined;
  const audience = t.event.startsWith("audience_");
  const [emoji, name] = {
    race_finish: ["🏁", `Im Ziel – Platz ${t.place}!`],
    battle_out:  ["🎈", `Ballons weg – Platz ${t.place}`],
    battle_win:  ["🏆", "Battle gewonnen!"],
    audience_steal: t.effect === "item" ? ["🫳", "Item gestohlen!"] : ["🍀", "Glück gehabt – nichts zu holen"],
    audience_say: ["💬", `„${t.text}“`],
  }[t.event] || describe(t.event);
  $("f-emoji").textContent = emoji;
  const recipient = t.event === "audience_say" ? "→ " : "";
  $("f-who").textContent = recipient + (t.player >= 0 ? `P${t.player + 1}` : recipient ? "Alle" : "");
  $("f-who").style.color = t.player >= 0 ? color(t.player, t.character) : "";
  $("f-what").textContent = name;
  $("f-ml").textContent = audience ? "📣 PUBLIKUM" : finish ? placeLabel(t.place) : `+${fmtCl(t.ml)}`;
  $("flash").classList.add("show");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => $("flash").classList.remove("show"), 2200);
}

function setOnline(online) {
  $("conn").textContent = online ? "● live" : "● offline – verbinde neu…";
  $("conn").classList.toggle("off", !online);
}

function connect() {
  let gotData = false;
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = m => { gotData = true; setOnline(true); const s = JSON.parse(m.data); render(s); flash(s.latest); };
  ws.onclose = () => {
    setOnline(false);
    // Reconnect a working WebSocket; poll where WebSockets don't get through.
    if (gotData) setTimeout(connect, 2000);
    else poll();
  };
  setTimeout(() => { if (!gotData) ws.close(); }, 5000);
}

async function poll() {
  let version = -1;
  for (;;) {
    try {
      const r = await fetch(`/state?since=${version}`, { cache: "no-store" });
      if (r.status === 200) {
        const s = await r.json();
        // Don't replay an old flash animation on the first load.
        if (version !== -1) flash(s.latest);
        version = s.version;
        render(s);
      }
      setOnline(r.ok);
    } catch (e) {
      setOnline(false);
    }
    await new Promise(resolve => setTimeout(resolve, 1500));
  }
}
connect();
</script>
</body>
</html>
